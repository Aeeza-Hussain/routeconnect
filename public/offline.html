<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline Mode — RouteConnect</title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0b132b;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
        }
        .offline-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(51, 65, 85, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            max-width: 32rem;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .pulse-icon {
            width: 5rem;
            height: 5rem;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #10b981;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-weight: 700;
            padding: 0.875rem 1.75rem;
            border-radius: 9999px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
            transition: all 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 20px -3px rgba(16, 185, 129, 0.4);
        }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            font-weight: 600;
            padding: 0.875rem 1.75rem;
            border-radius: 9999px;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.18);
        }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }
        .status-pill.online {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="pulse-icon">
            <i class="fa-solid fa-wifi-slash"></i>
        </div>

        <div>
            <div id="statusPill" class="status-pill">
                <i class="fa-solid fa-circle text-[8px] animate-pulse"></i>
                <span>Currently Disconnected</span>
            </div>
        </div>

        <h1 style="font-size: 1.75rem; font-weight: 800; margin: 0 0 0.75rem 0; letter-spacing: -0.025em;">
            RouteConnect Offline Mode
        </h1>

        <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin: 0 0 2rem 0;">
            You are currently offline. Don't worry! Your cached trips, schedules, and digital bookings are saved locally on this device.
        </p>

        <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 2rem;">
            <button onclick="window.location.reload()" class="btn-primary">
                <i class="fa-solid fa-rotate-right"></i> Check Connection & Retry
            </button>
            <a href="/" class="btn-secondary">
                <i class="fa-solid fa-house"></i> Go to Cached Home
            </a>
        </div>

        <div style="border-top: 1px solid rgba(51, 65, 85, 0.8); padding-top: 1.25rem; font-size: 0.8rem; color: #64748b; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
            <i class="fa-solid fa-shield-halved text-emerald-500"></i>
            <span>Local Offline Cache Active — Safe & Secure</span>
        </div>
    </div>

    <script>
        // Automatic reconnection listener
        window.addEventListener('online', () => {
            const pill = document.getElementById('statusPill');
            if (pill) {
                pill.classList.add('online');
                pill.innerHTML = '<i class="fa-solid fa-circle text-[8px] animate-pulse"></i> Connection Restored! Reloading...';
            }
            setTimeout(() => {
                window.location.reload();
            }, 800);
        });
    </script>
</body>
</html>
